# Local development: `docker compose up` starts Postgres and the API (migrations run first).
# Only the database: `docker compose up -d db`, then run the API from your virtualenv with `make dev`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: careerline
      POSTGRES_PASSWORD: careerline
      POSTGRES_DB: careerline
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careerline -d careerline']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://careerline:careerline@db:5432/careerline
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret-key-change-me}
      WEB_CONCURRENCY: '1'
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
