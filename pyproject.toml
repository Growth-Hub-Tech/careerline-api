[project]
name = "careerline-api"
version = "2.0.0"
description = "CareerLine AI API: skill tests, scoring, proficiency levels and personalised learning pathways"
readme = "README.md"
requires-python = ">=3.13"

# Dependencies are pinned in requirements.txt (runtime) and requirements-dev.txt (tools).

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501", # long strings and comments are fine; the formatter wraps code
    "B008", # FastAPI dependencies are declared as Depends() defaults
    "UP042", # (str, Enum) models keep their exact behaviour; StrEnum changes str()/format() output
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["UP"] # generated by Alembic's template

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
packages = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
