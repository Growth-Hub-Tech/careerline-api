{# Building blocks emails can import: {% from "_components.html" import button with context %} #}
{% macro button(url, label) -%}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
  <tr>
    <td style="border-radius:6px; background-color:{{ brand.color }};">
      <a href="{{ url }}" style="display:inline-block; padding:12px 24px; font-size:16px; font-weight:bold; color:#FFFFFF; text-decoration:none;">{{ label }}</a>
    </td>
  </tr>
</table>
<p style="margin:0 0 16px 0; font-size:13px; color:#64748B;">If the button does not work, copy this link into your browser:<br><a href="{{ url }}" style="color:{{ brand.color }}; word-break:break-all;">{{ url }}</a></p>
{%- endmacro %}
