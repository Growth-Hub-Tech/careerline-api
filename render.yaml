# Render Blueprint for the CareerLine test server: web API + background worker + Postgres 16.
# (On the free plan, which has no worker service, create the web service by hand and set
# RUN_JOBS_IN_WEB=true: see docs/api.md, "Test server".)
# Render dashboard: New > Blueprint > pick this repo and branch. Values marked sync: false are
# asked for once in the dashboard; nothing secret is stored in this file.
# Real values and the exact steps are in docs/api.md ("Test server").

databases:
  - name: careerline-test-db
    databaseName: careerline
    user: careerline
    postgresMajorVersion: '16'
    plan: basic-256mb
    region: frankfurt
    ipAllowList: [] # only Render services can connect

services:
  - type: web
    name: careerline-api
    runtime: python
    region: frankfurt
    plan: starter
    branch: dev
    buildCommand: pip install -r requirements.txt
    # Runs `alembic upgrade head` first; the server never starts if migrations fail, so every
    # deploy migrates the database before it takes traffic
    startCommand: bash scripts/start.sh
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerline-test-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true # Render makes a long random value once and keeps it
      - key: CORS_ORIGINS
        sync: false # the website's address(es), comma-separated, e.g. https://careerline-web.onrender.com,http://localhost:5173
      - key: OPENAI_API_KEY
        sync: false # optional: without it a plain fallback recommendation is used
      - key: APP_ENV
        value: staging
      - key: SAMPLE_API_ENABLED
        value: 'true' # sample answers for the endpoints not built yet (off in production)
      - key: SEED_ON_START
        value: 'true' # load seeds/ (levels, skills, questions) after migrating, on every deploy
      - key: LOG_JSON
        value: 'true'
      - key: WEB_CONCURRENCY
        value: '2'
      - key: RUN_JOBS_IN_WEB
        value: 'false' # the worker below runs the jobs (on the free plan, with no worker, set true)
      - key: TEST_MAILBOX_TOKEN
        sync: false # emails go to the test mailbox on staging; this keeps GET /api/v1/test-mailbox private
      - key: SUPPORT_EMAIL
        sync: false # where contact form messages go (on staging they land in the test mailbox)
      - key: FRONTEND_URL
        sync: false # the website: confirmation and reset links in emails point to its /verify-email and /reset-password pages
      - key: PYTHON_VERSION
        value: 3.13.12

  - type: worker
    name: careerline-worker
    runtime: python
    region: frankfurt
    plan: starter
    branch: dev
    buildCommand: pip install -r requirements.txt
    # Runs the background jobs (emails, AI advice); stops cleanly on SIGTERM
    startCommand: python -m app.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerline-test-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: careerline-api
          envVarKey: SECRET_KEY
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_ENV
        value: staging
      - key: LOG_JSON
        value: 'true'
      - key: SUPPORT_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.12
