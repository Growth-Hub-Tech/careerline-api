# Render Blueprint for CareerLine: the test server (branch dev, APP_ENV=staging) and production
# (branch main, APP_ENV=production), each a web API + background worker + Postgres 16.
# (On the free plan, which has no worker service, create the test web service by hand and set
# RUN_JOBS_IN_WEB=true: see docs/api.md, "Test server".)
# Render dashboard: New > Blueprint > pick this repo and branch. Values marked sync: false are
# asked for once in the dashboard; nothing secret is stored in this file.
# Real values and the exact steps: docs/api.md ("Test server") and docs/launch.md (production).
# Syncing this file creates every service in it, production's included: review the plans first.

databases:
  - name: careerline-test-db
    databaseName: careerline
    user: careerline
    postgresMajorVersion: '16'
    plan: basic-256mb
    region: frankfurt
    ipAllowList: [] # only Render services can connect

  - name: careerline-production-db
    databaseName: careerline
    user: careerline
    postgresMajorVersion: '16'
    plan: basic-256mb # production needs daily backups and point-in-time recovery (docs/launch.md)
    region: frankfurt
    ipAllowList: []

services:
  - type: web
    name: careerline-api
    runtime: python
    region: frankfurt
    plan: starter
    branch: dev
    buildCommand: pip install -r requirements.txt
    # Runs `alembic upgrade head` first; the server never starts if migrations fail, so every
    # deploy migrates the database before it takes traffic
    startCommand: bash scripts/start.sh
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerline-test-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true # Render makes a long random value once and keeps it
      - key: CORS_ORIGINS
        sync: false # the website's address(es), comma-separated, e.g. https://careerline-web.onrender.com,http://localhost:5173
      - key: SESSION_COOKIE_SAMESITE
        value: none # the test website and API are on different domains (production keeps lax)
      - key: OPENAI_API_KEY
        sync: false # optional: without it a plain fallback recommendation is used
      - key: PAYSTACK_SECRET_KEY
        sync: false # Paystack TEST secret key (sk_test_...) on the test server; without it payments answer 503
      - key: APP_ENV
        value: staging
      - key: LOG_JSON
        value: 'true'
      - key: SENTRY_DSN
        sync: false # where errors are reported (Sentry); optional on the test server
      - key: RUN_JOBS_IN_WEB
        value: 'false' # the worker below runs the jobs (on the free plan, with no worker, set true)
      - key: FRONTEND_URL
        sync: false # the website: invitation links and Paystack's return point to it
      - key: PYTHON_VERSION
        value: 3.13.12

  - type: worker
    name: careerline-worker
    runtime: python
    region: frankfurt
    plan: starter
    branch: dev
    buildCommand: pip install -r requirements.txt
    # Runs the background jobs (AI advice, renewals, data exports); stops cleanly on SIGTERM
    startCommand: python -m app.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerline-test-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: careerline-api
          envVarKey: SECRET_KEY
      - key: OPENAI_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false # subscription renewals charge the saved card from the worker
      - key: APP_ENV
        value: staging
      - key: LOG_JSON
        value: 'true'
      - key: SENTRY_DSN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.12

  # ---------- production (docs/launch.md) ----------

  - type: web
    name: careerline-api-production
    runtime: python
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start.sh
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerline-production-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production # refuses to start while a launch setting is wrong (app/core/launch_checks.py)
      - key: LOG_JSON
        value: 'true'
      - key: RUN_JOBS_IN_WEB
        value: 'false' # the production worker runs the jobs
      - key: CORS_ORIGINS
        sync: false # the website's https origin(s)
      - key: FRONTEND_URL
        sync: false # the website's https address (invitation links and Paystack's return)
      - key: PAYSTACK_SECRET_KEY
        sync: false # the live key (sk_live_...)
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.12

  - type: worker
    name: careerline-worker-production
    runtime: python
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerline-production-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: careerline-api-production
          envVarKey: SECRET_KEY
      - key: APP_ENV
        value: production
      - key: LOG_JSON
        value: 'true'
      - key: FRONTEND_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false # subscription renewals charge the saved card from the worker
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.12
