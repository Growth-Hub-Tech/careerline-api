name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# A new push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'

jobs:
  main-guard:
    name: PRs into main come from dev
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Pull requests into main must come from dev (this one is from '$HEAD_REF')."
            exit 1
          fi

  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: openapi.json is up to date
        run: python scripts/export_openapi.py --check

  test:
    name: Migrations, startup and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careerline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d careerline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careerline_test
      # The integration tests get their own database (created and migrated by tests/integration/conftest.py)
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careerline_integration_test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      APP_ENV: test
      LOG_JSON: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Exactly one migration head
        run: |
          heads=$(alembic heads | grep -c "(head)")
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected one Alembic head, found $heads. Add a merge migration (alembic merge heads)."
            alembic heads
            exit 1
          fi

      - name: Migrate an empty database to head
        run: alembic upgrade head

      - name: App starts on the migrated database
        run: |
          PORT=8000 WEB_CONCURRENCY=1 bash scripts/start.sh > server.log 2>&1 &
          server=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/readyz; then
              kill "$server"
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Tests (unit + database integration)
        run: pytest

  secrets:
    name: Secret scan (current files)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks

      - name: Scan the files in this commit
        # Only the current tree (git archive), not the git history: an old leaked password in the
        # history is being handled separately and must not block every PR. Any secret in the
        # current files, including everything this PR adds, fails the job.
        run: |
          mkdir "$RUNNER_TEMP/tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/tree" --redact --no-banner --verbose

  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-audit
        # Report only: some pinned packages (e.g. ecdsa via python-jose) have advisories with no fix yet
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc on || echo "::warning::pip-audit found vulnerable dependencies; see this job's log."
